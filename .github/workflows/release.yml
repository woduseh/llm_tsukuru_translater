name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  ci:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify all deterministic gates
        run: npm run verify:full

      - name: Upload verification artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-verification-artifacts
          path: |
            artifacts/harness/
            artifacts/verify/

  release:
    needs: ci
    runs-on: windows-2022
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (renderer + main + electron-builder)
        run: npm run dist:all -- --publish=never

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: |
            dist/*.exe
